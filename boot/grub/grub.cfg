# =============================================================================
#  Orin OS — GRUB 2 configuration
#  boot/grub/grub.cfg
#
#  Loaded by GRUB from the ISO. Keep this boring: it is the one file in the
#  boot path that is interpreted rather than compiled, so a typo here fails at
#  the least debuggable possible moment.
# =============================================================================

set timeout=3
set default=0

# Orin boots the kernel through the Multiboot2 protocol. GRUB parses the header
# in .multiboot_header, loads the ELF PT_LOAD segments, builds the information
# structure, and enters 32-bit protected mode at header.entry_address.
menuentry "Orin OS" --class orin {
    multiboot2 /boot/orin_kernel.elf orin.log=info orin.console=both orin.selftest=on
    boot
}

menuentry "Orin OS (verbose serial)" --class orin {
    multiboot2 /boot/orin_kernel.elf orin.log=trace orin.console=serial orin.selftest=on
    boot
}

menuentry "Orin OS (no self-test, fastest boot)" --class orin {
    multiboot2 /boot/orin_kernel.elf orin.log=info orin.console=vga orin.selftest=off
    boot
}

# Recovery: a kernel that cannot boot must still be diagnosable. This entry
# keeps the identity map unhardened so early-init faults are reproducible.
menuentry "Orin OS (recovery: no NX hardening)" --class orin {
    multiboot2 /boot/orin_kernel.elf orin.log=trace orin.console=both orin.nx=off orin.selftest=on
    boot
}
