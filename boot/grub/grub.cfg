serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=0
set default=0
# M1 console is VGA text at 0xB8000. Keep GRUB from leaving a linear FB active.
set gfxpayload=text
menuentry "Orin OS" {
    multiboot2 /boot/orin_kernel.elf orin.log=trace orin.console=serial orin.selftest=on
    boot
}
